name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1 -skip 'TestUi'

      - name: Build amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=${{ github.ref_name }}" -o eurokey.exe .
      - name: Package amd64
        run: Compress-Archive -Force -Path eurokey.exe,exclude.txt,README.md -DestinationPath eurokey-${{ github.ref_name }}-windows-amd64.zip

      - name: Build arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -arch arm64 -manifest app.manifest -ico app.ico -o rsrc_arm64.syso
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.appVersion=${{ github.ref_name }}" -o eurokey.exe .
      - name: Package arm64
        run: Compress-Archive -Force -Path eurokey.exe,exclude.txt,README.md -DestinationPath eurokey-${{ github.ref_name }}-windows-arm64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: eurokey-*-windows-*.zip
          generate_release_notes: true
