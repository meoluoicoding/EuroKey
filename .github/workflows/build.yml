name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      # All tests run. The UI tests open the real settings window and skip
      # themselves when the runner has no interactive desktop.
      - name: Test
        run: go test ./... -count=1
      - name: Vet e2e module
        working-directory: e2e
        run: go vet ./...

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (${{ matrix.goarch }})
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # The committed resource object is amd64-only (rsrc_amd64.syso); Go
          # skips it for other architectures, so arm64 gets its own here.
          if ('${{ matrix.goarch }}' -eq 'arm64') {
            go run github.com/akavel/rsrc@v0.10.2 -arch arm64 -manifest app.manifest -ico app.ico -o rsrc_arm64.syso
          }
          go build -trimpath -ldflags "-H windowsgui -s -w" -o eurokey-windows-${{ matrix.goarch }}.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: eurokey-windows-${{ matrix.goarch }}
          path: eurokey-windows-${{ matrix.goarch }}.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux port (vet + tests + cross build)
        run: sh scripts/check-linux.sh

  # End-to-end typing: rod opens a browser, OS-level SendInput types through the
  # hook (EUROKEY_TEST_MAGIC), rod reads the value. Self-skips when the runner
  # has no focusable desktop browser, so a skip is not a failure.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build app
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o eurokey.exe .
      - name: End-to-end typing
        working-directory: e2e
        env:
          EUROKEY_E2E: "1"
        run: go test -run TestEuroKeyTyping -v -count=1
