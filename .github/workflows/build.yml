name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      # UI tests open the real settings window and need an interactive desktop,
      # so they are skipped in CI and run locally via scripts/check-eurokey.ps1.
      - name: Test
        run: go test ./... -count=1 -skip 'TestUi'
      - name: Vet e2e module
        working-directory: e2e
        run: go vet ./...

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build (${{ matrix.goarch }})
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o eurokey-windows-${{ matrix.goarch }}.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: eurokey-windows-${{ matrix.goarch }}
          path: eurokey-windows-${{ matrix.goarch }}.exe
          if-no-files-found: error
